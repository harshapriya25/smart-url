
name: Smart URL Shortener - CI/CD

on:
  push:
    branches:
      - dev
      - staging
      - main

  pull_request:
    branches:
      - dev
      - staging
      - main

  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: us-east-1

jobs:

  # JOB 1: TEST APPLICATION
  test:
    name: Test Smart URL Shortener
    runs-on: ubuntu-latest

    env:
      AWS_DEFAULT_REGION: us-east-1

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest

      - name: Run Python Tests
        run: |
          PYTHONPATH=backend pytest -v


  # JOB 2: DEPLOY TO AWS
  deploy:
    name: Deploy to AWS
    runs-on: ubuntu-latest

    needs: test

    if: github.event_name != 'pull_request'

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4


      # IDENTIFY ENVIRONMENT
      - name: Resolve Environment and Stack Name
        shell: bash
        run: |

          case "${GITHUB_REF_NAME}" in

            dev)
              TARGET_ENV="dev"
              ;;

            staging)
              TARGET_ENV="staging"
              ;;

            main)
              TARGET_ENV="prod"
              ;;

            *)
              echo "Unsupported branch: ${GITHUB_REF_NAME}"
              exit 1
              ;;

          esac

          STACK_NAME="smart-url-shortener-${TARGET_ENV}"

          echo "Environment: ${TARGET_ENV}"
          echo "Stack Name: ${STACK_NAME}"

          echo "TARGET_ENV=${TARGET_ENV}" >> "$GITHUB_ENV"
          echo "STACK_NAME=${STACK_NAME}" >> "$GITHUB_ENV"


      # AWS AUTHENTICATION
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}


      # INSTALL AWS SAM
      - name: Set up AWS SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true


      # BUILD APPLICATION
      - name: Build SAM Application
        run: |
          sam build --template-file template.yaml


      # DEPLOY AWS RESOURCES
      - name: Deploy Environment Stack
        run: |

          sam deploy \
            --template-file .aws-sam/build/template.yaml \
            --stack-name "${STACK_NAME}" \
            --resolve-s3 \
            --region "${AWS_REGION}" \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides Environment="${TARGET_ENV}"


      # DEPLOYMENT SUMMARY
      - name: Deployment Summary
        run: |

          echo "## Smart URL Shortener Deployment" >> "$GITHUB_STEP_SUMMARY"

          echo "- Environment: ${TARGET_ENV}" >> "$GITHUB_STEP_SUMMARY"

          echo "- Stack Name: ${STACK_NAME}" >> "$GITHUB_STEP_SUMMARY"

          echo "- AWS Region: ${AWS_REGION}" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "### CloudFormation Outputs" >> "$GITHUB_STEP_SUMMARY"

          aws cloudformation describe-stacks \
            --stack-name "${STACK_NAME}" \
            --region "${AWS_REGION}" \
            --query "Stacks[0].Outputs" \
            --output table >> "$GITHUB_STEP_SUMMARY"
