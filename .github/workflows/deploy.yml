
name: Smart URL Shortener - CI/CD

on:
  push:
    branches: [dev, staging, main]
  pull_request:
    branches: [dev, staging, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test application
    runs-on: ubuntu-latest
    env:
      AWS_DEFAULT_REGION: us-east-1

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest

      - name: Run tests
        run: |
          PYTHONPATH=backend pytest -q

  deploy:
    name: Deploy to AWS
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve Environment & Stack Name
        shell: bash
        run: |
          case "${GITHUB_REF_NAME}" in
            dev)
              TARGET_ENV="dev"
              ;;
            staging)
              TARGET_ENV="staging"
              ;;
            main)
              TARGET_ENV="prod"
              ;;
            *)
              echo "Unsupported branch: ${GITHUB_REF_NAME}"
              exit 1
              ;;
          esac

          STACK_NAME="smart-url-shortener-${TARGET_ENV}"

          echo "Target Environment: $TARGET_ENV"
          echo "Stack Name: $STACK_NAME"

          echo "TARGET_ENV=$TARGET_ENV" >> "$GITHUB_ENV"
          echo "STACK_NAME=$STACK_NAME" >> "$GITHUB_ENV"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Set up AWS SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Build SAM application
        run: sam build --template-file template.yaml

      - name: Deploy environment stack
        run: |
          sam deploy \
            --stack-name "${STACK_NAME}" \
            --resolve-s3 \
            --region "${{ vars.AWS_REGION || 'us-east-1' }}" \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides Environment="${TARGET_ENV}"
